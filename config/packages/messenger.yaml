framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: "%env(string:REDIS_SESSION_URL)%"
                retry_strategy:
                    delay: 0
            low_priority:
                dsn: "%env(string:REDIS_SESSION_URL)%"
                retry_strategy:
                    delay: 0
            high_priority:
                dsn: "%env(string:REDIS_SESSION_URL)%"
                retry_strategy:
                    delay: 0
            failed: "doctrine://default?queue_name=failed"

    # Send mails over Message Queue
    mailer:
        message_bus: 'messenger.default_bus'
